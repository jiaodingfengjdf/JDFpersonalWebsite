<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#04070a"/>
      <stop offset="0.55" stop-color="#06120c"/>
      <stop offset="1" stop-color="#020806"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#39ff14" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#39ff14" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <pattern id="code" width="420" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-3)">
      <g fill="#39ff14" fill-opacity="0.1" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
        <text x="0" y="18">const token = await sign(payload)</text>
        <text x="420" y="18">if (!ok) throw new Error</text>
      </g>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#code)"/>

  <!-- 终端光标 -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#39ff14">
    <text x="120" y="150" font-size="20" fill-opacity="0.55">&gt; kirameku --theme hacker</text>
    <text x="120" y="186" font-size="20" fill-opacity="0.35">[ok] matrix online</text>
    <rect x="120" y="212" width="14" height="22" fill-opacity="0.7"/>
  </g>

  <!-- 右侧竖排字符雨 -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#39ff14">
    <g fill-opacity="0.14">
      <text x="1640" y="120">01001</text>
      <text x="1680" y="260">10110</text>
      <text x="1720" y="420">11001</text>
      <text x="1760" y="560">00110</text>
      <text x="1800" y="700">10101</text>
      <text x="1840" y="860">01110</text>
    </g>
    <g fill-opacity="0.22">
      <text x="1600" y="200">sys</text>
      <text x="1660" y="360">root</text>
      <text x="1700" y="520">0x7f</text>
      <text x="1740" y="680">sudo</text>
    </g>
  </g>

  <rect width="1920" height="1080" fill="url(#scan)"/>
</svg>
