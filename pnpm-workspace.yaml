# Keep the virtual store free of the optional database-driver peers that
# drizzle-orm declares (postgres, mysql2, pg, ...). Only better-sqlite3 is used.
autoInstallPeers: false

allowBuilds:
  # v13 ships Node-API binaries; avoid pnpm's implicit node-gyp install on Windows.
  better-sqlite3: false
  core-js: false
  es5-ext: false
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - dompurify@3.5.0
